<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c8db5"/>
    </marker>
    <marker id="arwd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="700" fill="#0a0d14"/>
  <text x="40" y="40" fill="#e5edf7" font-size="22" font-weight="700">Enterprise Multi-Agent RAG — High-Level Design</text>
  <text x="40" y="62" fill="#94a3b8" font-size="13">Google ADK agents · Qdrant hybrid (vector + BM25) · local free embeddings/re-ranker · pluggable LLM · React UI</text>

  <!-- ===== INGESTION LANE ===== -->
  <rect x="24" y="86" width="1032" height="220" rx="12" fill="#0e1420" stroke="#243049"/>
  <text x="44" y="112" fill="#38bdf8" font-size="14" font-weight="700">1 · DATA INGESTION  (offline / batch — runs on ingest, idempotent)</text>

  <!-- sources -->
  <g font-size="12" fill="#e5edf7">
    <rect x="44" y="132" width="150" height="40" rx="8" fill="#161c2b" stroke="#3a67c4"/>
    <text x="119" y="157" text-anchor="middle">Confluence pages</text>
    <rect x="44" y="182" width="150" height="40" rx="8" fill="#161c2b" stroke="#2aa0b8"/>
    <text x="119" y="207" text-anchor="middle">Word .docx files</text>
    <rect x="44" y="232" width="150" height="40" rx="8" fill="#161c2b" stroke="#c48b2a"/>
    <text x="119" y="257" text-anchor="middle">ServiceNow tickets</text>
  </g>

  <!-- pipeline steps -->
  <g font-size="12">
    <rect x="238" y="150" width="150" height="104" rx="8" fill="#161c2b" stroke="#243049"/>
    <text x="313" y="188" text-anchor="middle" fill="#e5edf7" font-weight="600">Connectors</text>
    <text x="313" y="208" text-anchor="middle" fill="#94a3b8">normalize to</text>
    <text x="313" y="224" text-anchor="middle" fill="#94a3b8">common schema</text>

    <rect x="428" y="150" width="160" height="104" rx="8" fill="#161c2b" stroke="#243049"/>
    <text x="508" y="188" text-anchor="middle" fill="#e5edf7" font-weight="600">Chunk + Metadata</text>
    <text x="508" y="208" text-anchor="middle" fill="#94a3b8">~400 tokens,</text>
    <text x="508" y="224" text-anchor="middle" fill="#94a3b8">15% overlap (no LLM)</text>

    <rect x="628" y="150" width="188" height="104" rx="8" fill="#161c2b" stroke="#243049"/>
    <text x="722" y="184" text-anchor="middle" fill="#e5edf7" font-weight="600">Embed (fastembed)</text>
    <text x="722" y="204" text-anchor="middle" fill="#94a3b8">dense: all-MiniLM-L6-v2</text>
    <text x="722" y="220" text-anchor="middle" fill="#94a3b8">sparse: BM25</text>

    <rect x="856" y="150" width="176" height="104" rx="8" fill="#12233a" stroke="#38bdf8"/>
    <text x="944" y="190" text-anchor="middle" fill="#e5edf7" font-weight="700">Qdrant Hybrid Index</text>
    <text x="944" y="210" text-anchor="middle" fill="#94a3b8">single collection</text>
    <text x="944" y="226" text-anchor="middle" fill="#94a3b8">dense + sparse vectors</text>
  </g>

  <!-- ingestion arrows -->
  <g stroke="#7c8db5" stroke-width="1.6" fill="none" marker-end="url(#arw)">
    <path d="M194 152 L236 176"/>
    <path d="M194 202 L236 200"/>
    <path d="M194 252 L236 226"/>
    <path d="M388 202 L426 202"/>
    <path d="M588 202 L626 202"/>
    <path d="M816 202 L854 202"/>
  </g>
  <text x="313" y="276" text-anchor="middle" fill="#64748b" font-size="10.5">dedup via content-hash registry (MongoDB)</text>

  <!-- ===== RETRIEVAL LANE ===== -->
  <rect x="24" y="322" width="1032" height="352" rx="12" fill="#0e1420" stroke="#243049"/>
  <text x="44" y="348" fill="#34d399" font-size="14" font-weight="700">2 · DATA RETRIEVAL  (online / per user question — streamed)</text>

  <!-- UI + api -->
  <g font-size="12">
    <rect x="44" y="380" width="150" height="70" rx="8" fill="#161c2b" stroke="#818cf8"/>
    <text x="119" y="410" text-anchor="middle" fill="#e5edf7" font-weight="600">React UI</text>
    <text x="119" y="428" text-anchor="middle" fill="#94a3b8">chat + live trace</text>

    <rect x="230" y="385" width="140" height="60" rx="8" fill="#161c2b" stroke="#243049"/>
    <text x="300" y="410" text-anchor="middle" fill="#e5edf7" font-weight="600">FastAPI</text>
    <text x="300" y="428" text-anchor="middle" fill="#94a3b8">/api/chat/stream (SSE)</text>
  </g>

  <!-- ADK pipeline box -->
  <rect x="404" y="366" width="628" height="228" rx="10" fill="#0c1526" stroke="#34557f"/>
  <text x="420" y="388" fill="#38bdf8" font-size="12.5" font-weight="700">Google ADK — Multi-Agent Pipeline (SequentialAgent)</text>

  <g font-size="11.5">
    <rect x="420" y="400" width="190" height="40" rx="7" fill="#1a1633" stroke="#c48b2a"/>
    <text x="515" y="425" text-anchor="middle" fill="#e5edf7">Orchestrator · rewrite query</text>

    <!-- parallel -->
    <rect x="420" y="452" width="190" height="128" rx="7" fill="#101a2e" stroke="#3a67c4" stroke-dasharray="4 3"/>
    <text x="515" y="470" text-anchor="middle" fill="#94a3b8">ParallelAgent (fan-out)</text>
    <rect x="432" y="478" width="166" height="28" rx="6" fill="#161c2b" stroke="#3a67c4"/>
    <text x="515" y="497" text-anchor="middle" fill="#e5edf7">Document Agent</text>
    <rect x="432" y="512" width="166" height="28" rx="6" fill="#161c2b" stroke="#2aa0b8"/>
    <text x="515" y="531" text-anchor="middle" fill="#e5edf7">Incident Agent</text>
    <rect x="432" y="546" width="166" height="28" rx="6" fill="#161c2b" stroke="#a78bfa"/>
    <text x="515" y="565" text-anchor="middle" fill="#e5edf7">Search Agent (fallback)</text>

    <rect x="650" y="452" width="360" height="52" rx="7" fill="#161c2b" stroke="#34d399"/>
    <text x="830" y="474" text-anchor="middle" fill="#e5edf7" font-weight="600">Re-rank / Validate (bge cross-encoder)</text>
    <text x="830" y="492" text-anchor="middle" fill="#94a3b8">RRF merge → threshold → grounded? (knowledge-base only)</text>

    <rect x="650" y="522" width="360" height="52" rx="7" fill="#1b1a33" stroke="#818cf8"/>
    <text x="830" y="544" text-anchor="middle" fill="#e5edf7" font-weight="600">Response Agent</text>
    <text x="830" y="562" text-anchor="middle" fill="#94a3b8">grounded answer + [n] citations + suggested resolution</text>
  </g>

  <!-- retrieval arrows -->
  <g stroke="#7c8db5" stroke-width="1.6" fill="none" marker-end="url(#arw)">
    <path d="M194 414 L228 414"/>
    <path d="M370 414 L402 430"/>
    <path d="M515 440 L515 450"/>
    <path d="M610 516 L648 490"/>
    <path d="M830 504 L830 520"/>
  </g>
  <!-- response back to UI -->
  <path d="M650 548 C 250 640, 150 560, 119 452" stroke="#34d399" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <text x="360" y="628" fill="#34d399" font-size="10.5">answer + citations + trace (streamed token-by-token)</text>

  <!-- hybrid search up to index -->
  <path d="M515 452 C 515 300, 900 300, 944 256" stroke="#38bdf8" stroke-width="1.7" fill="none" stroke-dasharray="5 3" marker-end="url(#arwd)"/>
  <text x="705" y="300" text-anchor="middle" fill="#38bdf8" font-size="10.5">hybrid search: dense + BM25 → RRF fusion</text>

  <!-- LLM pluggable -->
  <rect x="650" y="400" width="360" height="40" rx="7" fill="#161c2b" stroke="#243049"/>
  <text x="830" y="424" text-anchor="middle" fill="#e5edf7" font-size="11.5">LLM (pluggable via env): Emergent · Gemini · OpenAI</text>
  <g stroke="#4b5a7a" stroke-width="1.2" fill="none" stroke-dasharray="3 3">
    <path d="M610 420 L648 420"/>
    <path d="M830 522 L830 442"/>
  </g>
</svg>
